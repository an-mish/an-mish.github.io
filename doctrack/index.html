<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Документы">
<title>Сроки документов</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1e21; --muted: #6b6f76; --line: #e3e1dc;
  --accent: #2f5bea; --accent-ink: #fff;
  --ok: #1f8a4c; --ok-bg: #e5f4ea;
  --warn: #a35d00; --warn-bg: #fdf0dc;
  --bad: #c0352b; --bad-bg: #fbe5e3;
  --sub: #2f5bea; --sub-bg: #e6ecfd;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --card: #1f2024; --text: #ececee; --muted: #9a9ca3; --line: #2e3036;
    --accent: #6d8dff; --accent-ink: #0d0f14;
    --ok: #5fcf8d; --ok-bg: #173323;
    --warn: #f0b35a; --warn-bg: #3a2b14;
    --bad: #ff7b70; --bad-bg: #3d1b19;
    --sub: #8aa4ff; --sub-bg: #1d2747;
    --shadow: none;
  }
}
html, body { margin: 0; }
body {
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--bg); color: var(--text);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 96px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 9px 14px; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 1.25rem; line-height: 1; }

.banner-actions { display: flex; align-items: center; gap: 2px; }
.banner .btn { padding: 6px 12px; color: var(--accent); }
.banner {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px;
  margin-bottom: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between;
  font-size: .93rem;
}
.summary { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px; box-shadow: var(--shadow); min-width: 0; }
.stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: .74rem; line-height: 1.25; color: var(--muted); overflow-wrap: break-word; }
.stat.sub b { color: var(--sub); }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); } .stat.ok b { color: var(--ok); }

.list { display: grid; gap: 10px; }
.doc {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  box-shadow: var(--shadow); display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%;
}
.doc-sub { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 2px; }
.doc-name { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.doc-type { font-size: .82rem; color: var(--muted); }
.pill { font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.sub { color: var(--sub); background: var(--sub-bg); }
.note-ico { font-size: .9em; margin-left: 4px; }
.check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: .95rem; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.check input { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); }
.doc-dates { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--muted); }
.doc-dates b { color: var(--text); font-weight: 500; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty p { margin: 0 0 16px; }

.fab {
  position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  font-size: 1.8rem; box-shadow: 0 6px 20px rgba(0,0,0,.2); cursor: pointer;
}

dialog {
  border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 24px));
  background: var(--card); color: var(--text); max-height: calc(100vh - 24px);
}
dialog * { min-width: 0; }
dialog { overflow-x: hidden; }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: 18px 16px 16px; display: grid; gap: 14px; }
.dlg h2 { margin: 0; font-size: 1.2rem; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; }
label { display: grid; gap: 5px; font-size: .88rem; color: var(--muted); }
input, select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 70px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lead { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.hint a { color: var(--accent); }
.hint { font-size: .82rem; color: var(--muted); margin: -6px 0 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .spacer { flex: 1; }
.menu { display: grid; gap: 8px; }
.menu .btn { text-align: left; white-space: normal; }
.menu small { display: block; color: var(--muted); font-size: .8rem; }
.sync { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.sync.err { color: var(--bad); }
.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem;
  opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; }
@media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
@media (max-width: 350px) { .stat { padding: 7px 6px; } .stat span { font-size: .68rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Мои документы</h1>
      <div class="sync" id="sync"></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Настройки и экспорт">⋯</button>
  </header>

  <div class="banner" id="notifBanner" hidden>
    <span>🔔 Уведомления о сроках</span>
    <span class="banner-actions">
      <button class="btn" id="notifBtn">Включить</button>
      <button class="icon-btn" id="notifClose" aria-label="Скрыть">✕</button>
    </span>
  </div>

  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="Добавить документ">+</button>

<dialog id="docDlg">
  <form class="dlg" id="docForm" method="dialog">
    <div class="dlg-head">
      <h2 id="docDlgTitle">Новый документ</h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <label>Тип
      <select name="type">
        <option>Паспорт</option>
        <option>Загранпаспорт</option>
        <option>Водительское удостоверение</option>
        <option>Виза</option>
        <option>ВНЖ / РВП</option>
        <option>Полис ОСАГО</option>
        <option>Полис ДМС / ОМС</option>
        <option>Медицинская справка</option>
        <option>Другое</option>
      </select>
    </label>
    <label>Название
      <input name="name" required placeholder="Например: Загран Анны" autocomplete="off">
    </label>
    <div class="row">
      <label>Дата выдачи
        <input type="date" name="issued">
      </label>
      <label>Действует до
        <input type="date" name="expires" required>
      </label>
    </div>
    <label>Начать обновление за
      <div class="lead">
        <input type="number" name="leadValue" min="0" max="999" required value="3" inputmode="numeric">
        <select name="leadUnit">
          <option value="d">дней</option>
          <option value="w">недель</option>
          <option value="m" selected>месяцев</option>
        </select>
      </div>
    </label>
    <p class="hint" id="leadHint"></p>
    <label class="check" id="submittedRow" hidden>
      <input type="checkbox" name="submitted"> Документы поданы на обновление
    </label>
    <label>Заметка
      <textarea name="note" placeholder="Где оформлять, что нужно с собой…"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn" hidden>Удалить</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="menuDlg">
  <div class="dlg">
    <div class="dlg-head">
      <h2>Напоминания и данные</h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <div class="menu">
      <button class="btn" id="icsBtn">📅 Добавить в календарь (.ics)
        <small>Напоминания придут из календаря телефона, даже если приложение закрыто</small></button>
      <button class="btn" id="driveBtn">☁️ Google Диск
        <small id="driveMenuHint">Хранить базу в Google Таблице и получать письма-напоминания</small></button>
      <button class="btn" id="testBtn">🔔 Уведомления браузера
        <small id="notifState"></small></button>
      <button class="btn" id="exportBtn">⬇️ Резервная копия (JSON)</button>
      <button class="btn" id="importBtn">⬆️ Восстановить из копии</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint" style="margin:0" id="storageHint"></p>
  </div>
</dialog>

<dialog id="driveDlg">
  <form class="dlg" id="driveForm">
    <div class="dlg-head">
      <h2>Google Диск</h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <p class="hint" style="margin:0">База хранится в Google Таблице на вашем Диске. Скрипт таблицы каждый день
      проверяет сроки и присылает письмо. Как получить адрес и ключ — в
      <a href="https://github.com/an-mish/an-mish.github.io/blob/main/doctrack/README.md" target="_blank" rel="noopener">инструкции</a>.</p>
    <label>Адрес веб-приложения
      <input name="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    </label>
    <label>Ключ доступа
      <input name="key" required autocomplete="off" spellcheck="false">
    </label>
    <div class="actions">
      <button type="button" class="btn danger" id="driveOff" hidden>Отключить</button>
      <span class="spacer"></span>
      <button type="submit" class="btn primary" id="driveOn">Подключить</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'doctrack.docs.v1';
const NOTIFIED_KEY = 'doctrack.notified.v1';
const DAY = 86400000;
const $ = s => document.querySelector(s);

// ---------- dates ----------
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtRu = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const daysBetween = (a, b) => Math.round((b - a) / DAY);

function subtractLead(expires, value, unit) {
  const d = new Date(expires);
  if (unit === 'm') {
    const day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() - value);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  } else {
    d.setDate(d.getDate() - value * (unit === 'w' ? 7 : 1));
  }
  return d;
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const daysWord = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;

function status(doc) {
  const t = today();
  const exp = parseDate(doc.expires);
  const start = subtractLead(exp, doc.leadValue, doc.leadUnit);
  const left = daysBetween(t, exp);
  let level, label;
  if (left < 0) { level = 'bad'; label = `Истёк ${daysWord(-left)} назад`; }
  else if (left === 0) { level = 'bad'; label = 'Истекает сегодня'; }
  else if (t >= start) { level = 'warn'; label = `Пора обновлять · ${daysWord(left)}`; }
  else { level = 'ok'; label = `Обновить с ${fmtRu(start)}`; }
  // Already handed in for renewal: no more nagging until the new expiry date is entered.
  if (doc.submitted && level !== 'ok') { level = 'sub'; label = '📨 Подан на обновление'; }
  return { exp, start, left, level, label, untilStart: daysBetween(t, start) };
}

// ---------- storage ----------
const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } };
let docs = load();
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(docs));
  syncToServiceWorker();
}

// ---------- Google Drive (Apps Script backend bound to a Google Sheet) ----------
const REMOTE_KEY = 'doctrack.remote.v1';
let remote = null;
try { remote = JSON.parse(localStorage.getItem(REMOTE_KEY)); } catch {}

async function api(action, payload = {}, conf = remote) {
  // text/plain keeps this a "simple" CORS request, which Apps Script web apps accept.
  // Apps Script may take a few seconds to wake up; never leave the app waiting forever.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  const res = await fetch(conf.url, {
    method: 'POST',
    signal: ctrl.signal,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: conf.key, action, ...payload }),
  }).catch(e => { throw new Error(e.name === 'AbortError' ? 'timeout' : 'network'); })
    .finally(() => clearTimeout(timer));
  let data;
  try { data = await res.json(); } catch { throw new Error('bad_response'); }
  if (!data.ok) throw new Error(data.error || 'error');
  return data.docs;
}

function setSync(text, isError) {
  const el = $('#sync');
  el.textContent = text;
  el.classList.toggle('err', !!isError);
  $('#storageHint').textContent = remote
    ? 'База хранится в Google Таблице на вашем Диске. На устройстве — копия для работы без интернета.'
    : 'Данные хранятся только на этом устройстве, в браузере. Подключите Google Диск или делайте резервную копию.';
  $('#driveMenuHint').textContent = remote ? 'Подключено · изменить или отключить' : 'Хранить базу в Google Таблице и получать письма-напоминания';
}

function applyRemote(list) {
  docs = list;
  save(); render();
  setSync('☁️ Google Диск · синхронизировано');
  checkAndNotify();
}

async function pull() {
  if (!remote) return setSync('📱 Только на этом устройстве');
  setSync('☁️ Google Диск · проверяю изменения…');
  try { applyRemote(await api('list')); }
  catch (e) { setSync(syncError(e), true); }
}

function syncError(e) {
  if (e.message === 'bad_key') return '⚠️ Неверный ключ доступа Google Диска';
  if (e.message === 'timeout') return '⚠️ Google Диск долго не отвечает · показана копия с устройства';
  return navigator.onLine ? '⚠️ Google Диск недоступен · показана копия с устройства' : '📴 Нет интернета · показана копия с устройства';
}

// All edits go to the sheet first, so the sheet stays the single source of truth.
async function mutate(action, payload, localApply) {
  if (!remote) { localApply(); save(); render(); return true; }
  setSync('☁️ Сохранение…');
  try { applyRemote(await api(action, payload)); return true; }
  catch (e) { setSync(syncError(e), true); toast('Не удалось сохранить на Google Диск'); return false; }
}

// ---------- render ----------
function render() {
  const items = docs.map(d => ({ d, s: status(d) })).sort((a, b) => a.s.exp - b.s.exp);
  const counts = { bad: 0, warn: 0, sub: 0, ok: 0 };
  items.forEach(i => counts[i.s.level]++);
  $('#summary').innerHTML = docs.length ? `
    <div class="stat bad"><b>${counts.bad}</b><span>Истекли</span></div>
    <div class="stat warn"><b>${counts.warn}</b><span>Обновить</span></div>
    ${counts.sub ? `<div class="stat sub"><b>${counts.sub}</b><span>Поданы</span></div>` : ''}
    <div class="stat ok"><b>${counts.ok}</b><span>В порядке</span></div>` : '';
  $('#summary').hidden = !docs.length;

  if (!docs.length) {
    $('#list').innerHTML = `<div class="empty"><p>Пока нет документов.<br>Добавьте первый — и приложение напомнит, когда пора его обновить.</p>
      <button class="btn primary" onclick="openDoc()">Добавить документ</button></div>`;
    return;
  }
  $('#list').innerHTML = items.map(({ d, s }) => {
    const color = `var(--${s.level})`;
    let pct = 100;
    if (d.issued) {
      const iss = parseDate(d.issued), total = s.exp - iss;
      if (total > 0) pct = Math.max(0, Math.min(100, (s.exp - today()) / total * 100));
    } else if (s.left < 0) pct = 0;
    return `<button class="doc" data-id="${d.id}">
      <div>
        <div class="doc-name">${esc(d.name)}${d.note ? `<span class="note-ico" title="${esc(d.note)}" aria-label="Есть заметка">📝</span>` : ''}</div>
        <div class="doc-sub"><span class="doc-type">${esc(d.type)}</span><span class="pill ${s.level}">${s.label}</span></div>
      </div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="doc-dates">
        ${d.issued ? `<span>Выдан <b>${fmtRu(parseDate(d.issued))}</b></span>` : ''}
        <span>До <b>${fmtRu(s.exp)}</b></span>
        ${s.level === 'sub' ? `<span>Подан <b>${fmtRu(parseDate(d.submitted))}</b></span>` : ''}
        ${s.level === 'ok' ? `<span>Осталось <b>${daysWord(s.left)}</b></span>` : ''}
      </div>
    </button>`;
  }).join('');
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- form ----------
const form = $('#docForm');
let editingId = null;

function openDoc(id) {
  editingId = id || null;
  form.reset();
  const d = docs.find(x => x.id === id);
  $('#docDlgTitle').textContent = d ? 'Редактировать' : 'Новый документ';
  $('#deleteBtn').hidden = !d;
  if (d && ![...form.elements.type.options].some(o => o.value === d.type)) form.elements.type.add(new Option(d.type));
  if (d) for (const k of ['type', 'name', 'issued', 'expires', 'leadValue', 'leadUnit', 'note']) form.elements[k].value = d[k] ?? '';
  form.elements.submitted.checked = !!d?.submitted;
  $('#submittedRow').hidden = !d || (status(d).level === 'ok' && !d.submitted);
  updateLeadHint();
  $('#docDlg').showModal();
}

function updateLeadHint() {
  const f = form.elements;
  if (!f.expires.value || f.leadValue.value === '') { $('#leadHint').textContent = ''; return; }
  const start = subtractLead(parseDate(f.expires.value), +f.leadValue.value, f.leadUnit.value);
  $('#leadHint').textContent = `Напоминание начнётся ${fmtRu(start)}`;
}
['expires', 'leadValue', 'leadUnit'].forEach(n => form.elements[n].addEventListener('input', updateLeadHint));
form.elements.type.addEventListener('change', e => {
  if (!form.elements.name.value) form.elements.name.value = e.target.value;
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const f = form.elements;
  if (f.issued.value && f.issued.value > f.expires.value) { toast('Дата выдачи позже даты окончания'); return; }
  const orig = docs.find(x => x.id === editingId);
  let submitted = f.submitted.checked ? (orig?.submitted || fmtISO(today())) : '';
  // A new expiry date means the renewed document has arrived.
  const renewed = orig?.submitted && submitted && f.expires.value !== orig.expires;
  if (renewed) submitted = '';
  const data = {
    id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    submitted,
    type: f.type.value, name: f.name.value.trim(), issued: f.issued.value, expires: f.expires.value,
    leadValue: Math.max(0, parseInt(f.leadValue.value, 10) || 0), leadUnit: f.leadUnit.value, note: f.note.value.trim(),
  };
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  const ok = await mutate('upsert', { doc: data }, () => {
    const i = docs.findIndex(x => x.id === data.id);
    if (i >= 0) docs[i] = data; else docs.push(data);
  });
  btn.disabled = false;
  if (!ok) return;
  $('#docDlg').close();
  if (renewed) toast('Срок обновлён — отметка «подан» снята');
  else if (submitted && remote && !docs.find(x => x.id === data.id)?.submitted) {
    toast('Отметка не сохранилась в Таблице — обновите код скрипта (см. инструкцию)');
  }
  checkAndNotify();
  maybeShowNotifBanner();
});

$('#deleteBtn').addEventListener('click', async () => {
  if (!confirm('Удалить документ?')) return;
  const id = editingId;
  if (await mutate('delete', { id }, () => { docs = docs.filter(x => x.id !== id); })) $('#docDlg').close();
});

$('#list').addEventListener('click', e => { const b = e.target.closest('.doc'); if (b) openDoc(b.dataset.id); });
$('#addBtn').addEventListener('click', () => openDoc());
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

// ---------- notifications ----------
function messageFor(doc, s) {
  if (s.left < 0) return `«${doc.name}» истёк ${fmtRu(s.exp)}. Срочно обновите документ.`;
  if (s.left === 0) return `«${doc.name}» истекает сегодня!`;
  return `Пора обновить «${doc.name}»: действует до ${fmtRu(s.exp)}, осталось ${daysWord(s.left)}.`;
}

async function showNotification(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const opts = { body, tag, icon: 'icon-192.png', badge: 'icon-192.png' };
  const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
  if (reg) await reg.showNotification(title, opts); else new Notification(title, opts);
  return true;
}

async function checkAndNotify() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  let sent = {};
  try { sent = JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch {}
  const t = fmtISO(today());
  for (const d of docs) {
    const s = status(d);
    // Once per day per document; in-app also nudges for anything in the window not yet nudged today.
    if ((s.level !== 'warn' && s.level !== 'bad') || sent[d.id] === t) continue;
    if (await showNotification('Обновите документ', messageFor(d, s), d.id)) sent[d.id] = t;
  }
  localStorage.setItem(NOTIFIED_KEY, JSON.stringify(sent));
}

// The banner asks once; after any answer or a ✕ it stays hidden. The menu item remains for later.
const BANNER_KEY = 'doctrack.notifBannerDone.v1';
const bannerDone = () => { try { return localStorage.getItem(BANNER_KEY) === '1'; } catch { return false; } };
function hideBannerForGood() {
  try { localStorage.setItem(BANNER_KEY, '1'); } catch {}
  maybeShowNotifBanner();
}
function maybeShowNotifBanner() {
  const supported = 'Notification' in window;
  const perm = supported ? Notification.permission : 'unsupported';
  $('#notifBanner').hidden = perm !== 'default' || !docs.length || bannerDone();
  $('#notifState').textContent = {
    granted: 'Включены · нажмите, чтобы проверить',
    denied: 'Запрещены в настройках браузера',
    default: 'Выключены · нажмите, чтобы включить',
    unsupported: 'Не поддерживаются этим браузером',
  }[perm];
}
async function askPermission() {
  hideBannerForGood();
  const p = await Notification.requestPermission();
  if (p === 'granted') { registerPeriodicSync(); checkAndNotify(); toast('Уведомления включены'); }
  else if (p === 'denied') toast('Уведомления запрещены. Включить можно в настройках сайта в браузере');
  else toast('Браузер не показал запрос — разрешите уведомления через значок в адресной строке');
  return p;
}
$('#notifBtn').addEventListener('click', askPermission);
$('#notifClose').addEventListener('click', hideBannerForGood);
// Permission can also be changed from the browser's address bar or site settings.
navigator.permissions?.query({ name: 'notifications' }).then(st => {
  st.onchange = () => { maybeShowNotifBanner(); if (Notification.permission === 'granted') { registerPeriodicSync(); checkAndNotify(); } };
}).catch(() => {});
$('#testBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) return toast('Браузер не поддерживает уведомления. На iPhone сначала добавьте приложение на экран «Домой».');
  if (Notification.permission === 'default' && await askPermission() !== 'granted') return;
  if (!await showNotification('Сроки документов', 'Уведомления работают ✅', 'test')) toast('Уведомления запрещены в настройках браузера');
});

// ---------- service worker ----------
async function syncToServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.ready;
  reg.active?.postMessage({ type: 'docs', docs });
}
async function registerPeriodicSync() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!('periodicSync' in reg)) return;
    const perm = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (perm.state === 'granted') await reg.periodicSync.register('doc-check', { minInterval: 12 * 3600 * 1000 });
  } catch {}
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => { syncToServiceWorker(); registerPeriodicSync(); });
}

// ---------- menu: calendar, Google Drive, backup ----------
$('#menuBtn').addEventListener('click', () => $('#menuDlg').showModal());

function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsDate(d) { return fmtISO(d).replace(/-/g, ''); }
function buildIcs() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//doctrack//RU', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Сроки документов'];
  const event = (uid, date, summary, desc) => {
    const next = new Date(date); next.setDate(next.getDate() + 1);
    lines.push('BEGIN:VEVENT', `UID:${uid}@doctrack`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${icsDate(date)}`, `DTEND;VALUE=DATE:${icsDate(next)}`,
      `SUMMARY:${icsEscape(summary)}`, `DESCRIPTION:${icsEscape(desc)}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(summary)}`, 'TRIGGER:PT10H', 'END:VALARM',
      'END:VEVENT');
  };
  for (const d of docs) {
    const s = status(d);
    const note = d.note ? `\n${d.note}` : '';
    event(`${d.id}-start`, s.start, `Начать обновление: ${d.name}`, `Действует до ${fmtRu(s.exp)}${note}`);
    event(`${d.id}-expire`, s.exp, `Истекает: ${d.name}`, `Последний день действия документа.${note}`);
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#icsBtn').addEventListener('click', () => {
  if (!docs.length) return toast('Сначала добавьте документ');
  download('documents.ics', buildIcs(), 'text/calendar');
  toast('Откройте файл — события с напоминаниями добавятся в календарь');
});

const driveForm = $('#driveForm');
$('#driveBtn').addEventListener('click', () => {
  $('#menuDlg').close();
  driveForm.elements.url.value = remote?.url || '';
  driveForm.elements.key.value = remote?.key || '';
  $('#driveOff').hidden = !remote;
  $('#driveOn').textContent = remote ? 'Сохранить' : 'Подключить';
  $('#driveDlg').showModal();
});
driveForm.addEventListener('submit', async e => {
  e.preventDefault();
  const conf = { url: driveForm.elements.url.value.trim(), key: driveForm.elements.key.value.trim() };
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(conf.url)) return toast('Адрес должен начинаться с https://script.google.com/');
  $('#driveOn').disabled = true;
  try {
    let list = await api('list', {}, conf);
    // First connection: upload documents that exist only on this device.
    const known = new Set(list.map(d => d.id));
    const localOnly = docs.filter(d => !known.has(d.id));
    if (localOnly.length) list = await api('replace', { docs: [...list, ...localOnly] }, conf);
    remote = conf;
    localStorage.setItem(REMOTE_KEY, JSON.stringify(remote));
    applyRemote(list);
    $('#driveDlg').close();
    toast(localOnly.length ? `Подключено. Перенесено на Диск: ${localOnly.length}` : 'Google Диск подключён');
  } catch (err) {
    toast(err.message === 'bad_key' ? 'Неверный ключ доступа' : 'Не удалось подключиться — проверьте адрес и настройку доступа');
  } finally {
    $('#driveOn').disabled = false;
  }
});
$('#driveOff').addEventListener('click', () => {
  if (!confirm('Отключить Google Диск? Таблица останется на Диске, а на устройстве сохранится последняя копия.')) return;
  remote = null;
  localStorage.removeItem(REMOTE_KEY);
  setSync('📱 Только на этом устройстве');
  $('#driveDlg').close();
});

$('#exportBtn').addEventListener('click', () => download(`documents-${fmtISO(today())}.json`, JSON.stringify(docs, null, 2), 'application/json'));
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data) || !data.every(d => d.name && d.expires)) throw 0;
    if (docs.length && !confirm(`Заменить текущие документы (${docs.length}) данными из файла (${data.length})?`)) return;
    const list = data.map(d => ({ id: d.id || String(Math.random()).slice(2), type: d.type || 'Другое', issued: '', note: '', submitted: '', leadValue: 0, leadUnit: 'd', ...d }));
    if (await mutate('replace', { docs: list }, () => { docs = list; })) { $('#menuDlg').close(); toast('Данные восстановлены'); }
  } catch { toast('Неверный файл'); }
  e.target.value = '';
});

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

render();
maybeShowNotifBanner();
checkAndNotify();
pull();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); maybeShowNotifBanner(); checkAndNotify(); pull(); } });
</script>
</body>
</html>
