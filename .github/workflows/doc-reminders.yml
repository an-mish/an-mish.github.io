name: Document reminders

on:
  schedule:
    - cron: '7 6 * * *' # 09:07 Moscow time, every day
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить список всех документов в окне обновления, даже если сегодня не день напоминания'
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/doc-reminders.mjs
        env:
          DOCS_JSON: ${{ secrets.DOCS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ inputs.force }}
