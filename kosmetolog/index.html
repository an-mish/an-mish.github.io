<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Прайс">
<title>Прайс косметолога</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --bg: #f7f4f3; --card: #ffffff; --text: #1f1c1e; --muted: #6f686c; --line: #e7e1df;
  --accent: #b0476e; --accent-ink: #fff; --accent-bg: #f8e8ee;
  --ok: #1f8a4c; --ok-bg: #e5f4ea;
  --warn: #a35d00; --warn-bg: #fdf0dc;
  --bad: #c0352b; --bad-bg: #fbe5e3;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18161a; --card: #222024; --text: #eeeaec; --muted: #a29ca0; --line: #343036;
    --accent: #e57ba3; --accent-ink: #1a0d13; --accent-bg: #3a1d29;
    --ok: #5fcf8d; --ok-bg: #173323;
    --warn: #f0b35a; --warn-bg: #3a2b14;
    --bad: #ff7b70; --bad-bg: #3d1b19;
    --shadow: none;
  }
}
html, body { margin: 0; }
body {
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--bg); color: var(--text);
  padding: env(safe-area-inset-top) 0 0;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
header { margin-bottom: 12px; }
h1 { font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .9rem; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 10px 14px; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; padding: 13px; }
.btn.small { padding: 5px 10px; font-size: .88rem; }
.icon-btn { border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 1.25rem; line-height: 1; }

.search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 12px; }
.list { display: grid; gap: 8px; }
.group { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; margin: 16px 2px 6px; }
.group:first-child { margin-top: 0; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; width: 100%;
}
.card .main { flex: 1; min-width: 0; }
.card .name { font-weight: 600; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: .85rem; margin-top: 1px; }
.card .price { font-weight: 700; font-size: 1.2rem; white-space: nowrap; text-align: right; }
.card .price small { display: block; font-weight: 500; font-size: .78rem; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.r { background: var(--bad); } .dot.y { background: var(--warn); } .dot.g { background: var(--ok); }
.tag { display: inline-block; font-size: .74rem; padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.up { color: var(--bad); } .down { color: var(--ok); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }
.bottom-actions { margin-top: 14px; display: grid; gap: 8px; }
.note { background: var(--accent-bg); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin-bottom: 12px; }

.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 14px; }
.tier { border-radius: 12px; padding: 8px 10px; background: var(--bg); min-width: 0; }
.tier .k { font-size: .78rem; color: var(--muted); }
.tier .v { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
.tier.r .v { color: var(--bad); } .tier.y .v { color: var(--warn); } .tier.g { background: var(--ok-bg); } .tier.g .v { color: var(--ok); }

.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { color: var(--muted); font-size: .8rem; }
.tile .v { font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.tile.accent { background: var(--accent-bg); border-color: transparent; }
.tile.accent .v { color: var(--accent); }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 4px 4px env(safe-area-inset-bottom);
}
nav.tabs button { border: 0; background: none; padding: 8px 2px 6px; cursor: pointer; color: var(--muted); font-size: .74rem; display: grid; justify-items: center; gap: 2px; }
nav.tabs button span { font-size: 1.3rem; line-height: 1; }
nav.tabs button.on { color: var(--accent); font-weight: 600; }

dialog {
  border: 0; padding: 0; width: min(560px, 100vw); max-width: 100vw; max-height: 92dvh;
  margin: auto auto 0; border-radius: 18px 18px 0 0; background: var(--card); color: var(--text);
}
@media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
dialog::backdrop { background: rgba(0,0,0,.4); }
.sheet { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 12px; font-size: 1.2rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sheet h3 { margin: 18px 0 8px; font-size: 1rem; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: .85rem; color: var(--muted); }
.field input, .field select {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: .82rem; color: var(--muted); margin: -6px 0 12px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.actions .spacer { flex: 1; }
.calc-line { background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: .92rem; margin-bottom: 12px; }

table.br { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.br td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.br td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
table.br tr.total td { font-weight: 700; border-bottom: 0; }
table.br .m { color: var(--muted); font-size: .82rem; }

.line { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
.line .top { display: flex; align-items: center; gap: 6px; }
.line .top .nm { flex: 1; min-width: 0; font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
.line .ctrl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px; margin-top: 6px; align-items: center; }
.line input, .line select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.line .c { font-size: .8rem; color: var(--muted); margin-top: 4px; }

.hist { display: grid; gap: 6px; }
.hist .h { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
.hist .h .main { flex: 1; min-width: 0; }

.pick-list { display: grid; gap: 4px; max-height: 55dvh; overflow: auto; }
.pick-list button { text-align: left; border: 0; background: var(--bg); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.pick-list button small { display: block; color: var(--muted); font-size: .8rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 14px; font-size: .92rem; z-index: 20;
  max-width: calc(100vw - 32px); text-align: center;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Услуги</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs">
  <button data-tab="services" class="on"><span>💆</span>Услуги</button>
  <button data-tab="items"><span>🛒</span>Закупки</button>
  <button data-tab="kits"><span>🧺</span>Пакеты</button>
  <button data-tab="numbers"><span>📊</span>Мои цифры</button>
</nav>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<dialog id="pick"><div class="sheet" id="pickBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const KEY = 'kosmetolog-v2';
const CATS = ['Расходники', 'Косметика', 'Кола маска', 'Прочее'];

/* ---------- Default data (from the Notion workspace) ---------- */
function defaults() {
  const P = (price, qty) => [{ id: 'p0', date: '', price, qty, supplier: 'из Notion' }];
  const items = [
    ['gloves', 'Перчатки', 'Расходники', 'пара', P(9, 25)],
    ['pads', 'Ватные диски', 'Расходники', 'шт', P(3, 100)],
    ['sticks', 'Ватные палочки', 'Расходники', 'шт', []],
    ['tampons', 'Тампоны', 'Расходники', 'шт', []],
    ['napkins', 'Салфетки', 'Расходники', 'шт', []],
    ['cap', 'Шапочка', 'Расходники', 'шт', []],
    ['sheet', 'Простыня на кушетку', 'Расходники', 'шт', []],
    ['slippers', 'Тапочки', 'Расходники', 'пара', []],
    ['linen', 'Одноразовое бельё', 'Расходники', 'шт', []],
    ['tnt', 'TNT', 'Расходники', 'шт', P(7, 50)],
    ['oil', 'Массажное масло', 'Косметика', 'мл', P(8, 250)],
    ['cream', 'Антицеллюлитный крем', 'Косметика', 'мл', P(10, 300)],
    ['dye', 'Краска для бровей и ресниц', 'Косметика', 'мл', P(6, 15)],
    ['ox', 'Оксидант', 'Косметика', 'мл', P(6.4, 100)],
    ['clean', 'Средства для очистки (на процедуру)', 'Косметика', 'шт', P(1, 1)],
    ['anti', 'Антиоксидантна изсветляваща терапия 35% (Skeyndor)', 'Косметика', 'шт', P(75.48, 6)],
    ['hydra', 'Интензивна хидратираща терапия (Skeyndor)', 'Косметика', 'шт', P(73.27, 6)],
    ['cas', 'Касета', 'Кола маска', 'шт', P(1.5, 1)],
    ['strip', 'Ленты', 'Кола маска', 'шт', P(4, 250)],
    ['coil', 'Масло для кола маски', 'Кола маска', 'мл', P(1.53, 150)],
    ['small', 'Пакет малая зона', 'Кола маска', 'шт', P(1, 1)],
    ['mid', 'Пакет средняя зона', 'Кола маска', 'шт', P(1.5, 1)]
  ].map(([id, name, cat, unit, purchases]) => ({ id, name, cat, unit, purchases }));
  const L = o => Object.entries(o).map(([ref, qty]) => ({ type: ref.startsWith('k_') ? 'kit' : 'item', ref, qty }));
  const kits = [
    ['k_face', 'Косметическая процедура', { cap: 1, sheet: 1, gloves: 1, pads: 6, sticks: 2, napkins: 3 }],
    ['k_small', 'Малый косметический', { gloves: 1, pads: 2, sticks: 2, napkins: 1 }],
    ['k_massage', 'Массаж', { slippers: 1, linen: 1, sheet: 1, napkins: 2 }],
    ['k_cola', 'Кола маска', { slippers: 1, sheet: 1, gloves: 1, napkins: 2 }]
  ].map(([id, name, l]) => ({ id, name, lines: L(l) }));
  const services = [
    ['Массаж тела полный', 60, 30, { k_massage: 1, oil: 30 }],
    ['Массаж тела частичный', 30, 20, { k_massage: 1, oil: 15 }],
    ['Чистка лица', 90, 15, { k_face: 1, clean: 1 }],
    ['Кола маска ноги', 40, 15, { k_cola: 1, cas: 2, tnt: 2, strip: 50, coil: 10 }],
    ['Кола маска ноги 1/2', 20, 10, { k_cola: 1, tnt: 2, strip: 20, cas: 1, coil: 10 }],
    ['Кола маска подмышки', 10, 5, { k_cola: 1, mid: 1 }],
    ['Кола маска руки', 20, 10, { k_cola: 1, cas: 1, strip: 20, coil: 10 }],
    ['Кола маска руки 1/2', 15, 10, { k_cola: 1, strip: 10, cas: 0.5, coil: 10 }],
    ['Массаж головы', 20, 10, { tnt: 1 }],
    ['Массаж антицеллюлитный 1 час', 60, 30, { k_massage: 1, cream: 60, oil: 30 }],
    ['Массаж антицеллюлитный 1/2', 40, 20, { k_massage: 1, cream: 60, oil: 30 }],
    ['Коррекция бровей', 30, 5, { k_small: 1, small: 0.5 }],
    ['Коррекция и окрашивание бровей краской', 40, 5, { k_small: 1, small: 0.5, dye: 0.5, ox: 3 }],
    ['Антиоксидантна изсветляваща терапия', 75, 15, { k_face: 1, anti: 1, clean: 1, tnt: 1 }],
    ['Интензивна хидратираща терапия', 75, 15, { k_face: 1, hydra: 1, clean: 1, tnt: 1 }]
  ].map(([name, duration, pause, l], i) => ({ id: 's' + i, name, duration, pause, myPrice: null, lines: L(l) }));
  const costs = [
    ['Аренда', 200], ['Ток', 80], ['Вода', 3], ['Телефон', 13], ['Интернет', 5], ['Осигуровки', 300],
    ['Парковка', 80], ['Стирка', 100], ['Патент', 35], ['Реклама', 100]
  ].map(([name, monthly], i) => ({ id: 'c' + i, name, monthly }));
  return {
    settings: { hours: 100, income: 1100, reserve: 15, pauseShare: 100, matReserve: 0, roundTo: 1, currency: '€' },
    costs, items, kits, services
  };
}

/* ---------- State ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
if (!db || !Array.isArray(db.services) || !Array.isArray(db.items)) db = defaults();
db.settings = { ...defaults().settings, ...db.settings };
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Не удалось сохранить'); } }

let tab = 'services', query = '';

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')); return Number.isFinite(n) ? n : 0; };
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const nfu = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const nfq = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 3 });
const cur = () => db.settings.currency;
const money = v => `${nf2.format(v)} ${cur()}`;
const moneyR = v => `${(db.settings.roundTo >= 1 ? nf0 : nf2).format(v)} ${cur()}`;
const q = v => nfq.format(v);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const mins = m => m >= 60 ? `${Math.floor(m / 60)} ч${m % 60 ? ' ' + Math.round(m % 60) + ' мин' : ''}` : `${Math.round(m)} мин`;
const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) : 'из Notion';
const pct = (a, b) => b ? (a - b) / b * 100 : 0;

/* ---------- Calculation ---------- */
const itemById = id => db.items.find(x => x.id === id);
const kitById = id => db.kits.find(x => x.id === id);
const sortedPurchases = it => [...it.purchases].sort((a, b) => (b.date || '').localeCompare(a.date || '') || it.purchases.indexOf(b) - it.purchases.indexOf(a));
const lastPurchase = it => it && it.purchases.length ? sortedPurchases(it)[0] : null;
const unitPrice = it => { const p = lastPurchase(it); return p && p.qty > 0 ? p.price / p.qty : null; };

// One line in a kit or service: {type:'item'|'kit', ref, qty, perPack?}
function lineCost(l) {
  if (l.type === 'kit') {
    const k = kitById(l.ref); if (!k) return { cost: 0, missing: [], label: '— пакет удалён —' };
    const kc = kitCost(k);
    return { cost: kc.cost * num(l.qty), missing: kc.missing, label: k.name };
  }
  const it = itemById(l.ref); if (!it) return { cost: 0, missing: [], label: '— позиция удалена —' };
  const p = lastPurchase(it), up = unitPrice(it);
  if (up == null) return { cost: 0, missing: [it.name], label: it.name };
  if (l.perPack) return { cost: p.price / num(l.perPack), missing: [], label: it.name };
  return { cost: up * num(l.qty), missing: [], label: it.name };
}
function sumLines(lines) {
  let cost = 0; const missing = new Set();
  lines.forEach(l => { const c = lineCost(l); cost += c.cost; c.missing.forEach(m => missing.add(m)); });
  return { cost, missing: [...missing] };
}
const kitCost = k => sumLines(k.lines);
const expensesMonthly = () => db.costs.reduce((s, c) => s + num(c.monthly), 0);
const perHour = () => {
  const st = db.settings, h = st.hours > 0 ? st.hours : 1;
  return { exp: expensesMonthly() / h, income: num(st.income) / h };
};
const roundUp = v => { const r = db.settings.roundTo; return r > 0 ? Math.ceil(v / r - 1e-9) * r : v; };

function calc(s) {
  const st = db.settings, ph = perHour();
  const minutes = num(s.duration) + num(s.pause) * st.pauseShare / 100;
  const h = minutes / 60;
  const m = sumLines(s.lines);
  const materials = m.cost * (1 + st.matReserve / 100);
  const expenses = ph.exp * h, income = ph.income * h;
  const min = expenses + materials, zero = min + income;
  const rec = roundUp(zero * (1 + st.reserve / 100));
  const my = s.myPrice != null && s.myPrice !== '' ? num(s.myPrice) : null;
  const zone = p => p < min - 0.005 ? 'r' : p < zero - 0.005 ? 'y' : 'g';
  return { minutes, materials, rawMaterials: m.cost, missing: m.missing, expenses, income, min, zero, rec, my, zone: my != null ? zone(my) : null };
}

/* ---------- Views ---------- */
const TITLES = { services: 'Услуги', items: 'Закупки', kits: 'Пакеты', numbers: 'Мои цифры' };
const SUBS = {
  services: () => 'Рекомендуемая цена · нажмите для расчёта',
  items: () => 'Цены берутся из последней закупки',
  kits: () => 'Наборы мелочей на одну процедуру',
  numbers: () => `Час работы: ${money(perHour().exp + perHour().income)} (расходы ${money(perHour().exp)} + ваш доход ${money(perHour().income)})`
};

function render() {
  $('#title').textContent = TITLES[tab];
  $('#subtitle').textContent = SUBS[tab]();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = ({ services: viewServices, items: viewItems, kits: viewKits, numbers: viewNumbers })[tab]();
  const s = $('#search');
  if (s) {
    s.value = query;
    s.oninput = () => { query = s.value; const pos = s.selectionStart; render(); const n = $('#search'); n.focus(); n.setSelectionRange(pos, pos); };
  }
}
const match = name => !query || name.toLowerCase().includes(query.trim().toLowerCase());
const missingTag = n => n ? `<span class="tag warn">нет цены: ${n}</span>` : '';

function viewServices() {
  const list = db.services.filter(s => match(s.name));
  const anyMissing = new Set(); db.services.forEach(s => calc(s).missing.forEach(m => anyMissing.add(m)));
  return `${anyMissing.size ? `<div class="note">⚠︎ Без цены: ${[...anyMissing].map(esc).join(', ')}. Внесите закупку — и цены услуг пересчитаются. <button class="btn small" data-act="tab" data-to="items">К закупкам</button></div>` : ''}

function itemCard(it) {
  const ps = sortedPurchases(it), up = unitPrice(it);
  let change = '';
  if (ps.length > 1 && ps[1].qty > 0) {
    const d = pct(ps[0].price / ps[0].qty, ps[1].price / ps[1].qty);
    if (Math.abs(d) >= 0.5) change = ` · <span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${nf0.format(Math.abs(d))}%</span>`;
  }
  return `<button class="card" data-act="item" data-id="${it.id}">
    <div class="main"><div class="name">${esc(it.name)}</div>
    <div class="meta">${ps.length ? `${money(ps[0].price)} за ${q(ps[0].qty)} ${esc(it.unit)} · ${fmtDate(ps[0].date)}${change}` : '<span class="tag warn">нет закупок</span>'}</div></div>
    <div class="price">${up != null ? `${nfu.format(up)} ${cur()}<small>за 1 ${esc(it.unit)}</small>` : '—'}</div></button>`;
}

/* ---------- Dialogs ---------- */
const dlg = $('#dlg'), pickDlg = $('#pick');
function openSheet(html, onMount) {
  $('#dlgBody').innerHTML = html;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  onMount?.($('#dlgBody'));
}
const closeSheet = () => dlg.close();
[dlg, pickDlg].forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
const head = t => `<h2><span>${t}</span><button class="icon-btn" data-act="close" aria-label="Закрыть">✕</button></h2>`;

// Searchable chooser. Resolves with the chosen value, '__new' or null.
function pick(title, options, newLabel) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; pickDlg.close(); resolve(v); };
    const draw = f => options.filter(o => !f || o.label.toLowerCase().includes(f.toLowerCase()))
      .map(o => `<button data-v="${esc(o.value)}">${esc(o.label)}${o.sub ? `<small>${o.sub}</small>` : ''}</button>`).join('') || '<div class="empty">Не найдено</div>';
    $('#pickBody').innerHTML = `<h2><span>${title}</span><button class="icon-btn" data-x aria-label="Закрыть">✕</button></h2>
      <input class="search" type="search" placeholder="Поиск" id="pickSearch">
      <div class="pick-list" id="pickList">${draw('')}</div>
      ${newLabel ? `<div class="bottom-actions"><button class="btn block" data-v="__new">${newLabel}</button></div>` : ''}`;
    pickDlg.showModal();
    const s = $('#pickSearch');
    s.oninput = () => { $('#pickList').innerHTML = draw(s.value); };
    $('#pickBody').onclick = e => {
      if (e.target.closest('[data-x]')) return finish(null);
      const b = e.target.closest('[data-v]'); if (b) finish(b.dataset.v);
    };
    pickDlg.onclose = () => finish(null);
  });
}
const itemOptions = () => [...db.items].sort(byName).map(it => {
  const up = unitPrice(it);
  return { value: 'item:' + it.id, label: it.name, sub: `${esc(it.cat)} · ${up != null ? nfu.format(up) + ' ' + esc(cur()) + ' за 1 ' + esc(it.unit) : 'нет цены'}` };
});
const kitOptions = () => db.kits.map(k => ({ value: 'kit:' + k.id, label: '🧺 ' + k.name, sub: 'пакет · ' + money(kitCost(k).cost) }));

/* ---------- Lines editor (shared by kits and services) ---------- */
function linesEditor(box, lines, { allowKits }) {
  const draw = () => {
    box.innerHTML = lines.map((l, i) => {
      const lc = lineCost(l);
      const it = l.type === 'item' ? itemById(l.ref) : null;
      const unit = l.type === 'kit' ? 'шт' : (it?.unit || '');
      const mode = l.perPack ? 'pack' : 'unit';
      const ctrl = l.type === 'item'
        ? `<input data-i="${i}" data-f="${mode === 'pack' ? 'perPack' : 'qty'}" type="text" inputmode="decimal" value="${q(num(mode === 'pack' ? l.perPack : l.qty))}" aria-label="Количество">
           <select data-i="${i}" data-f="mode"><option value="unit" ${mode === 'unit' ? 'selected' : ''}>${esc(unit)} на процедуру</option><option value="pack" ${mode === 'pack' ? 'selected' : ''}>процедур из упаковки</option></select>`
        : `<input data-i="${i}" data-f="qty" type="text" inputmode="decimal" value="${q(num(l.qty))}" aria-label="Количество"><span class="sub">шт</span>`;
      return `<div class="line"><div class="top"><span class="nm">${l.type === 'kit' ? '🧺 ' : ''}${esc(lc.label)}</span>
        <button class="icon-btn" data-i="${i}" data-f="del" aria-label="Убрать">✕</button></div>
        <div class="ctrl">${ctrl}</div>
        <div class="c">${lc.missing.length ? `<span class="tag warn">нет цены: ${lc.missing.map(esc).join(', ')}</span> ` : ''}= ${money(lc.cost)}</div></div>`;
    }).join('') || '<div class="hint" style="margin:0 0 8px">Пока пусто</div>';
    const total = sumLines(lines);
    box.insertAdjacentHTML('beforeend', `<div class="calc-line">Итого: <b>${money(total.cost)}</b></div>
      <button class="btn block" type="button" data-f="add">＋ Добавить ${allowKits ? 'пакет или позицию' : 'позицию'}</button>`);
  };
  draw();
  box.addEventListener('change', e => {
    const i = e.target.dataset.i, f = e.target.dataset.f; if (i == null) return;
    const l = lines[i];
    if (f === 'qty') l.qty = num(e.target.value);
    if (f === 'perPack') l.perPack = num(e.target.value) || 1;
    if (f === 'mode') {
      if (e.target.value === 'pack') { l.perPack = 10; } else { delete l.perPack; if (!l.qty) l.qty = 1; }
    }
    draw();
  });
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
    if (b.dataset.f === 'del') { lines.splice(+b.dataset.i, 1); draw(); }
    if (b.dataset.f === 'add') {
      const v = await pick(allowKits ? 'Пакет или позиция' : 'Позиция', [...(allowKits ? kitOptions() : []), ...itemOptions()], '＋ Новая позиция');
      if (!v) return;
      if (v === '__new') { toast('Создайте позицию во вкладке «Закупки», затем добавьте её сюда'); return; }
      const [type, ref] = v.split(':');
      lines.push({ type, ref, qty: 1 }); draw();
    }
  });
}

      ${mat || '<tr><td class="m">Материалов нет</td><td></td></tr>'}
      ${st.matReserve ? `<tr><td>Запас на материалы ${q(st.matReserve)}%</td><td>${money(c.materials - c.rawMaterials)}</td></tr>` : ''}
      <tr><td>Расходы кабинета<div class="m">${money(ph.exp)}/ч × ${q(+h.toFixed(3))} ч</div></td><td>${money(c.expenses)}</td></tr>
      <tr class="total"><td>Минимум</td><td>${money(c.min)}</td></tr>
      <tr><td>Ваш доход<div class="m">${money(ph.income)}/ч × ${q(+h.toFixed(3))} ч</div></td><td>${money(c.income)}</td></tr>
      <tr class="total"><td>В ноль</td><td>${money(c.zero)}</td></tr>

      <tr class="total"><td>Рекомендуемая</td><td>${moneyR(c.rec)}</td></tr>
    </table>
    <div class="actions"><button class="btn" data-act="dupService" data-id="${s.id}">Копировать</button><span class="spacer"></span><button class="btn primary" data-act="editService" data-id="${s.id}">Изменить</button></div>`);
}

function editService(id) {

  openSheet(`${head(orig ? 'Изменить услугу' : 'Новая услуга')}
    <div class="field"><label>Название</label><input id="f_name" value="${esc(s.name)}"></div>

    </div>
    <div class="field"><label>Цена в вашем прайсе (если есть)</label><input id="f_my" type="text" inputmode="decimal" value="${s.myPrice ?? ''}" placeholder="Покажет, в какую зону попадает"></div>
    <h3>Материалы на одну процедуру</h3>
    <div class="hint" style="margin:-4px 0 10px">Добавьте пакет и отдельно косметику. Для косметики можно указать «мл на процедуру» или «процедур из упаковки».</div>

    <div class="actions">${orig ? `<button class="btn danger" id="del">Удалить</button>` : ''}<span class="spacer"></span>
      <button class="btn" data-act="close">Отмена</button><button class="btn primary" id="ok">Сохранить</button></div>`,
  body => {
    linesEditor(body.querySelector('#lines'), s.lines, { allowKits: true });

      s.name = body.querySelector('#f_name').value.trim();
      if (!s.name) return toast('Введите название');
      s.duration = num(body.querySelector('#f_dur').value);

  const it = orig ? clone(orig) : { id: uid('i'), name: '', cat: 'Расходники', unit: 'шт', purchases: [] };
  openSheet(`${head(orig ? 'Позиция' : 'Новая позиция')}
    <div class="field"><label>Название</label><input id="f_name" value="${esc(it.name)}" placeholder="Например, Шапочка"></div>
    <div class="row2">
      <div class="field"><label>Раздел</label><select id="f_cat">${CATS.map(c => `<option ${c === it.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Считаю в</label><input id="f_unit" value="${esc(it.unit)}" list="units"></div>
    </div>
    <datalist id="units"><option value="шт"><option value="пара"><option value="мл"><option value="г"><option value="м"></datalist>
    <div class="actions"><span class="spacer"></span><button class="btn" data-act="close">Отмена</button><button class="btn primary" id="ok">${orig ? 'Сохранить' : 'Далее'}</button></div>`,
  body => {
    body.querySelector('#f_name').focus();
    body.querySelector('#ok').onclick = () => {
      it.name = body.querySelector('#f_name').value.trim();
      if (!it.name) return toast('Введите название');
      it.cat = body.querySelector('#f_cat').value;
      it.unit = body.querySelector('#f_unit').value.trim() || 'шт';
      if (orig) Object.assign(orig, it); else db.items.push(it);
      save(); render();
      if (after) after(it.id); else showItem(it.id);
    };
  });
}

async function newPurchase(itemId) {
  if (!itemId) {
    const v = await pick('Что купили?', itemOptions(), '＋ Новая позиция');
    if (!v) return;
    if (v === '__new') return editItem(null, id => purchaseForm(id));
    itemId = v.split(':')[1];
  }
  purchaseForm(itemId);
}
function purchaseForm(itemId) {
  const it = itemById(itemId); if (!it) return;
  const last = lastPurchase(it), oldUp = unitPrice(it);
  openSheet(`${head('Закупка: ' + esc(it.name))}
    <div class="row2">
      <div class="field"><label>Цена упаковки, ${esc(cur())}</label><input id="f_price" type="text" inputmode="decimal" value="" placeholder="${last ? q(last.price) : ''}"></div>
      <div class="field"><label>В упаковке, ${esc(it.unit)}</label><input id="f_qty" type="text" inputmode="decimal" value="${last ? q(last.qty) : ''}"></div>
    </div>
    <div class="calc-line" id="preview">Введите цену и количество</div>
    <div class="row2">
      <div class="field"><label>Дата</label><input id="f_date" type="date" value="${today()}"></div>
      <div class="field"><label>Поставщик</label><input id="f_sup" value="${esc(last && last.supplier !== 'из Notion' ? last.supplier : '')}" list="sups"></div>
    </div>
    <datalist id="sups">${[...new Set(db.items.flatMap(i => i.purchases.map(p => p.supplier)).filter(s => s && s !== 'из Notion'))].map(s => `<option value="${esc(s)}">`).join('')}</datalist>
    <div class="actions"><span class="spacer"></span><button class="btn" data-act="close">Отмена</button><button class="btn primary" id="ok">Сохранить</button></div>`,
  body => {
    const pr = body.querySelector('#f_price'), qt = body.querySelector('#f_qty'), pv = body.querySelector('#preview');
    const upd = () => {
      const p = num(pr.value), n = num(qt.value);
      if (!(p > 0 && n > 0)) { pv.textContent = 'Введите цену и количество'; return; }
      const u = p / n, d = oldUp ? pct(u, oldUp) : 0;
      pv.innerHTML = `За 1 ${esc(it.unit)}: <b>${nfu.format(u)} ${esc(cur())}</b>${oldUp ? ` · было ${nfu.format(oldUp)}${Math.abs(d) >= 0.5 ? ` <span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${nf0.format(Math.abs(d))}%</span>` : ''}` : ''}`;
    };
    pr.oninput = qt.oninput = upd; pr.focus();
    body.querySelector('#ok').onclick = () => {
      const price = num(pr.value), qty = num(qt.value);
      if (!(price > 0)) return toast('Введите цену упаковки');
      if (!(qty > 0)) return toast('Сколько в упаковке?');
      it.purchases.push({ id: uid('p'), date: body.querySelector('#f_date').value || today(), price, qty, supplier: body.querySelector('#f_sup').value.trim() });
      save(); render(); closeSheet();
      const affected = db.services.filter(s => calcUses(s, it.id)).length;
      toast(`Сохранено. Пересчитано услуг: ${affected}`);
    };
  });
}
function calcUses(s, itemId) {
  return s.lines.some(l => (l.type === 'item' && l.ref === itemId) || (l.type === 'kit' && kitById(l.ref)?.lines.some(x => x.ref === itemId)));
}

function editCost(id) {
  const orig = db.costs.find(x => x.id === id);
  const c = orig ? clone(orig) : { id: uid('c'), name: '', monthly: 0 };
  openSheet(`${head(orig ? 'Статья расхода' : 'Новая статья')}
    <div class="field"><label>Название</label><input id="f_name" value="${esc(c.name)}"></div>
    <div class="field"><label>Сумма в месяц, ${esc(cur())}</label><input id="f_sum" type="text" inputmode="decimal" value="${q(num(c.monthly))}"></div>
    <div class="actions">${orig ? `<button class="btn danger" id="del">Удалить</button>` : ''}<span class="spacer"></span>
      <button class="btn" data-act="close">Отмена</button><button class="btn primary" id="ok">Сохранить</button></div>`,
  body => {
    body.querySelector('#ok').onclick = () => {
      c.name = body.querySelector('#f_name').value.trim();
      if (!c.name) return toast('Введите название');
      c.monthly = num(body.querySelector('#f_sum').value);
      if (orig) Object.assign(orig, c); else db.costs.push(c);
      save(); render(); closeSheet();
    };
    body.querySelector('#del')?.addEventListener('click', () => {
      if (!confirm(`Удалить «${c.name}»?`)) return;
      db.costs = db.costs.filter(x => x.id !== id); save(); render(); closeSheet();
    });
  });
}

/* ---------- Events ---------- */
let toastTimer;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], nav.tabs button'); if (!t || t.closest('#pick')) return;
  if (t.dataset.tab) { tab = t.dataset.tab; query = ''; render(); window.scrollTo(0, 0); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'close': closeSheet(); break;
    case 'tab': tab = t.dataset.to; query = ''; render(); window.scrollTo(0, 0); break;
    case 'service': showService(id); break;
    case 'editService': editService(id); break;
    case 'newService': editService(null); break;
    case 'dupService': {
      const s = db.services.find(x => x.id === id);
      const copy = { ...clone(s), id: uid('s'), name: s.name + ' (копия)' };
      db.services.splice(db.services.indexOf(s) + 1, 0, copy); save(); render(); editService(copy.id); break;
    }
    case 'kit': editKit(id); break;
    case 'newKit': editKit(null); break;
    case 'item': showItem(id); break;
    case 'editItem': editItem(id); break;
    case 'newItem': editItem(null); break;
    case 'newPurchase': newPurchase(null); break;
    case 'purchaseFor': purchaseForm(id); break;
    case 'delPurchase': {
      const it = itemById(id);
      if (!confirm('Удалить эту закупку?')) break;
      it.purchases = it.purchases.filter(p => p.id !== t.dataset.p); save(); render(); showItem(id); break;
    }
    case 'delItem': {
      const it = itemById(id);
      const n = db.kits.filter(k => k.lines.some(l => l.ref === id)).length + db.services.filter(s => s.lines.some(l => l.ref === id)).length;
      if (!confirm(n ? `«${it.name}» используется в ${n} пакетах/услугах и будет убрана из них. Удалить?` : `Удалить «${it.name}»?`)) break;
      db.items = db.items.filter(x => x.id !== id);
      db.kits.forEach(k => { k.lines = k.lines.filter(l => l.ref !== id); });
      db.services.forEach(s => { s.lines = s.lines.filter(l => !(l.type === 'item' && l.ref === id)); });
      save(); render(); closeSheet(); break;
    }
    case 'cost': editCost(id); break;
    case 'newCost': editCost(null); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `prais-kosmetologa-${today()}.json`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case 'import': $('#file').click(); break;
    case 'reset':
      if (!confirm('Вернуть исходные данные? Все ваши закупки и изменения пропадут.')) break;
      db = defaults(); save(); render(); toast('Данные сброшены'); break;
  }
});

document.addEventListener('change', async e => {
  const k = e.target.dataset.set;
  if (k) {
    if (k === 'currency') db.settings.currency = e.target.value.trim() || '€';
    else {
      const v = num(e.target.value);
      if (k === 'hours' && v <= 0) { toast('Часов должно быть больше 0'); render(); return; }
      db.settings[k] = Math.max(0, v);
    }
    save(); render(); return;
  }
  if (e.target.id === 'file') {
    try {
      const data = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(data.services) || !Array.isArray(data.items) || !Array.isArray(data.kits)) throw 0;
      db = data; db.settings = { ...defaults().settings, ...db.settings };
      save(); render(); toast('Данные загружены');
    } catch { toast('Файл не подходит'); }
  }
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
